talks:
  - id: 2026-11-10-riazi
    date_confirmed: true
    date: 2026-11-10
    start: "2026-11-10T16:00:00+01:00"
    end: "2026-11-10T17:00:00+01:00"
    speaker: Maryam Riazi
    affiliation: City Science Laboratory, Department of Physics and Astronomy, University of Bologna
    title: "Synthetic Population for Bologna: Maximum-Entropy Approach via Persistent Contrastive Divergence on Heterogeneous ISTAT Data"
    abstract: >-
      Synthetic populations are needed where census microdata are unavailable and individual privacy must be preserved. This talk presents a synthetic population of 500,000 inhabitants for the Comune of Bologna, each described by 34 categorical attributes (about 2.6 × 10^19 possible profiles) and built from aggregate ISTAT tables alone.

      The population is generated with GibbsPCDSolver, a stochastic maximum-entropy solver based on Persistent Contrastive Divergence that remains tractable for a large number of attributes. The central difficulty is dealing with real-world heterogeneous data: the ISTAT tables are published at five geographical levels and contradict one another, so no joint distribution can satisfy all targets at once. A reliability-weighting scheme is proposed to handle the residual error. A further requirement is that no individual be logically impossible; a Metropolis–Hastings move that transposes an entire block of attributes in one step removes such cases, and four diagnostic tools support the analysis.

      The resulting population contains no logically impossible individual and retains full diversity, a property that reweighting methods such as raking lose and that downstream agent-based simulations of Bologna require.
