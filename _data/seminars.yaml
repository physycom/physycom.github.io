    end: "2026-12-15T17:00:00+01:00"
    speaker: Roberto Garrone
    affiliation: Open University of Cyprus
    title: Synthetic populations as initial conditions for agent-based models
    abstract: >-
      Synthetic populations are usually discussed in terms of how they are generated. This talk takes a complementary perspective, focusing on their use as initial conditions for agent-based models.
      The starting point is the recent study "When Does the Seed Stop Mattering?", which compares IPF and MaxEnt using AVQ and POSAS data for 1,255 municipalities of Piedmont and Aosta Valley. The discussion centres on the relationship between local information, statistical dependencies inherited from the donor, and the accuracy of the reconstruction.
      From there, the talk turns to the initialisation of agent-based models, using AWSim as an application case to introduce an open question: which properties of the synthetic population must actually be preserved for the conclusions of a simulation to remain reliable?
