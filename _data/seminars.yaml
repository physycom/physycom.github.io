  - id: 2026-11-24-scarpa
    date_confirmed: true
    date: 2026-11-24
    start: "2026-11-24T16:00:00+01:00"
    end: "2026-11-24T17:00:00+01:00"
    speaker: Silvia Scarpa
    affiliation: University of Modena and Reggio Emilia
    title: Evaluating synthetic population approaches for Italian municipal-level microdata
    abstract: >-
      Policy evaluation at small-area level calls for fine-scale microdata, but available sources pull in opposite directions: socio-economic surveys offer rich individual and household information only at coarse geographic levels, while administrative sources give detailed local counts with limited variable depth.

      This talk addresses this trade-off by implementing and comparing deterministic (Iterative Proportional Fitting, Generalized Regression) and probabilistic (Simulated Annealing) reweighting algorithms that align survey weights with known population benchmarks. As an application, a spatially disaggregated synthetic population of the residents of the municipalities of the Emilia-Romagna region is built from the Italian EU-SILC data. The comparison highlights the trade-off between the computational efficiency of deterministic methods and the precision of probabilistic approaches, and offers practical guidance for spatial microsimulation on method fidelity, computational resources and statistical accuracy.
